<div class="container">
  <h1>Lista de Pessoas</h1>

  <div class="actions-container">
    <mat-form-field appearance="outline">
      <mat-label>Filtrar por Nome</mat-label>
      <input matInput [(ngModel)]="filtroNome" (keyup)="aplicarFiltro()" placeholder="Digite um nome...">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="carregarDados()">
      Carregar Dados
    </button>
  </div>

  <div class="mat-elevation-z8">
    <!-- Observe a mudança para usar dataSource diretamente -->
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- CPF Column -->
      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>CPF</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.cpf}}</td>
      </ng-container>

      <!-- Nome Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.name}}</td>
      </ng-container>

      <!-- Genero Column -->
      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Gênero</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.gender}}</td>
      </ng-container>

      <!-- Idade Column -->
      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Idade</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.age}}</td>
      </ng-container>

      <!-- Endereco Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Endereço</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.address}}</td>
      </ng-container>

      <!-- Municipio Column -->
      <ng-container matColumnDef="city">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Município</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.city}}</td>
      </ng-container>

      <!-- Estado Column -->
      <ng-container matColumnDef="state">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
        <td mat-cell *matCellDef="let pessoa">{{pessoa.state}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Linha mostrada quando não há dados correspondentes -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="7">
          <div class="no-data-message">
            <span *ngIf="dataSource.filter">Nenhum resultado encontrado para "{{filtroNome}}"</span>
            <span *ngIf="!dataSource.filter">Sem dados para exibir. Clique em "Carregar Dados".</span>
          </div>
        </td>
      </tr>
    </table>

    <!-- O paginador agora funcionará corretamente com o MatTableDataSource -->
    <mat-paginator
      [pageSizeOptions]="[10]"
      [pageSize]="10"
      showFirstLastButtons
      aria-label="Selecione a página de pessoas">
    </mat-paginator>
  </div>
</div>
